<!DOCTYPE html>
<html>

<head>

  <meta name="description" content="" />

  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <!-- Place favicon.ico in the root directory -->

  <style>
    body {
      background-color: #e9ebee;
      font-family: system, -apple-system, ".SFNSText-Regular", "San Francisco",
        "Roboto", "Segoe UI", "Helvetica Neue", "Lucida Grande", sans-serif;
      font-size: 16px;
      margin: 0 auto;
      max-width: 800px;
    }
  </style>

  <!-- Feuille de style du TP2 -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <nav>
    <a href="..">🏠 Index</a> / TP2
  </nav>

  <h1>TP #2</h1>

  <form action="action.html" method="get">
    <p>
      <label for="name">Nom</label>
      <input type="text" id="name" name="name" minlength="2" maxlength="20" required />
      <span class="icon-ok">✔</span>
    </p>

    <p>
      <label for="firstname">Prénom</label>
      <input type="text" id="firstname" name="firstname" minlength="2" maxlength="20" required />
      <span class="icon-ok">✔</span>
    </p>

    <p>
      <label for="birthday">Date de naissance</label>
      <input type="date" id="birthday" name="birthday" required />
      <span class="icon-ok">✔</span>
    </p>

    <p>
      <label for="address">Adresse</label>
      <input type="text" id="address" name="address" minlength="5" maxlength="50" required />
      <span class="icon-ok">✔</span>
    </p>

    <p>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" minlength="5" maxlength="30" required />
      <span class="icon-ok">✔</span>
    </p>

    <p class="form-actions">
      <input type="submit" value="Envoyer" class="btn-primary" />
    </p>
  </form>
</body>

</html>
