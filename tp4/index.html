<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <title>TP4 - HTML5</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- CSS bootstrap -->
  <link rel="stylesheet" href="css/bootstrap.css" />

  <!-- librairie Javascript de bootstrap (modal, collapse...) -->
  <script src="js/bootstrap.bundle.js"></script>

  <!-- géolocalisation -->
  <script src="js/gps.js"></script>

  <!-- stockage des contacts -->
  <script src="js/store.js"></script>

  <!-- notre script de validation -->
  <script src="js/form-validation.js"></script>
</head>

<body>
  <div class="container">

    <nav class="mt-3">
      <a href="..">🏠 Index</a> / TP4
    </nav>

    <h1 class="my-4">TP #4 - HTML5</h1>

    <form>
      <!-- Nom -->
      <div class="row mb-3">
        <label for="name" class="col-sm-2 col-form-label">Nom</label>
        <div class="col-sm-9">
          <input type="text" class="form-control" id="name" name="name" placeholder="Votre nom"
            onkeyup="calcNbChar(this.id)" />
        </div>
        <div class="col-sm-1 col-form-label" data-count>0 car.</div>
      </div>

      <!-- Prénom -->
      <div class="row mb-3">
        <label for="firstname" class="col-sm-2 col-form-label">Prénom</label>
        <div class="col-sm-9">
          <input type="text" class="form-control" id="firstname" name="firstname" placeholder="Votre prénom"
            onkeyup="calcNbChar(this.id)" />
        </div>
        <div class="col-sm-1 col-form-label" data-count>0 car.</div>
      </div>

      <!-- Date de naissance (pas de compteur : toujours 10 caractères) -->
      <div class="row mb-3">
        <label for="birthday" class="col-sm-2 col-form-label">Date de naissance</label>
        <div class="col-sm-9">
          <input type="date" class="form-control" id="birthday" name="birthday" />
        </div>
      </div>

      <!-- Adresse + bouton GPS -->
      <div class="row mb-3">
        <label for="address" class="col-sm-2 col-form-label">Adresse</label>
        <div class="col-sm-9">
          <div class="input-group">
            <input type="text" class="form-control" id="address" name="address" placeholder="Votre ville"
              onkeyup="calcNbChar(this.id)" />
            <button type="button" class="btn btn-outline-secondary" id="gps">📍 GPS</button>
          </div>
          <!-- la carte s'affichera ici -->
          <div id="map" class="mt-2"></div>
        </div>
        <div class="col-sm-1 col-form-label" data-count>0 car.</div>
      </div>

      <!-- Email -->
      <div class="row mb-3">
        <label for="email" class="col-sm-2 col-form-label">Email</label>
        <div class="col-sm-9">
          <input type="email" class="form-control" id="email" name="email" placeholder="exemple@mail.com"
            onkeyup="calcNbChar(this.id)" />
        </div>
        <div class="col-sm-1 col-form-label" data-count>0 car.</div>
      </div>

      <!-- Boutons -->
      <div class="row">
        <div class="col-sm-9 offset-sm-2">
          <button type="submit" class="btn btn-primary">Valider</button>
          <!-- NOUVEAU : bouton Reset (type="button" pour ne pas envoyer le formulaire) -->
          <button type="button" class="btn btn-danger" id="reset">Reset</button>
        </div>
      </div>
    </form>

    <!-- NOUVEAU : tableau des contacts -->
    <h2 class="mt-5">Liste des contacts</h2>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Nom</th>
          <th>Prénom</th>
          <th>Date de naissance</th>
          <th>Adresse</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody>
        <!-- rempli en JavaScript par displayContactList() -->
      </tbody>
    </table>

  </div>

  <!-- Modal Bootstrap (affichée en JavaScript) -->
  <div class="modal fade" id="myModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Modal title</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">...</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
